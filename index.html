<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スマホのもしも帖｜IT学習・三現主義支援プラットフォーム（プロトタイプ）</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="is-title-view">
  <!-- Persistent Fixed-Position Top Bar (4.1 UI要件: 恒常的な戻る・ホームボタン) -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <button
        id="header-brand-btn"
        type="button"
        class="header-brand"
        aria-label="TOP画面へ戻る"
      >
        <span class="brand-icon" aria-hidden="true">📱</span>
        <span class="brand-text">
          <span class="brand-title">スマホのもしも帖</span>
          <span class="brand-subtitle">立ち止まる・確かめる・相談する練習帖</span>
        </span>
      </button>
      <nav class="header-nav" aria-label="共通ナビゲーション">
        <button id="global-back-btn" type="button" class="btn btn-nav">
          ← ひとつ戻る
        </button>
        <button id="global-home-btn" type="button" class="btn btn-nav btn-nav-home">
          🏠 TOPへ
        </button>
      </nav>
    </div>
  </header>

  <main class="app-main" id="app-main">
    <div id="app-load-status" hidden></div>

    <!-- View: Title Cover (TOP画面) -->
    <section id="view-title" class="app-view title-view" aria-label="タイトル画面">
      <div class="title-stage">
        <button
          id="btn-title-start"
          type="button"
          class="title-cover-btn"
          aria-label="スマホのもしも帖 詐欺トレ をはじめる（ストーリー一覧へ進む）"
        >
          <img
            src="./images/title-cover.jpg"
            alt="スマホのもしも帖 詐欺トレ 〜詐欺に備えて鍛えるべし〜 浮世絵風女性と背後の偽物警官イラスト TAP TO START"
            class="title-cover-img"
            width="1024"
            height="572"
          />
        </button>
        <div class="title-actions">
          <button
            id="btn-title-start-sub"
            type="button"
            class="btn btn-primary btn-large title-start-btn"
          >
            ▶ はじめる（次へ進む）
          </button>
          <p class="title-tap-hint">※上のイラストをタップしても進めます</p>
        </div>
        <div class="title-kb-area">
          <button
            id="btn-title-db"
            type="button"
            class="btn btn-amber-outline btn-medium title-db-btn"
          >
            📚 ナレッジベースを見る（みんなのつまずき・知恵）
          </button>
        </div>
      </div>
    </section>

    <!-- View: Episodes List -->
    <section id="view-episodes" class="app-view" hidden></section>

    <!-- View: Sound Novel Player -->
    <section id="view-novel" class="app-view" hidden></section>

    <!-- View: Knowledge Database -->
    <section id="view-db" class="app-view" hidden></section>
  </main>

  <footer class="app-footer">
    <p>スマホのもしも帖 プロトタイプ（GitHub Pages対応・CSVデータ駆動）</p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
